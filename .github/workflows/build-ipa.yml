name: Build TrollStore IPA

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 上游仓库 (owner/repo)
        required: true
        default: lxsfful/dsh-go
      upstream_ref:
        description: 上游分支 / tag / commit
        required: true
        default: main
      bundle_id:
        description: Bundle Identifier
        required: true
        default: io.github.lxsfful.dshgo.troll
      deployment_target:
        description: iOS Deployment Target
        required: true
        default: "15.0"
      flutter_version:
        description: Flutter SDK 版本
        required: true
        default: 3.47.7
      make_release:
        description: 同时创建 Release（方便手机直接下载）
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "ios-overlay/**"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: write

concurrency:
  group: build-trollstore-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Select Xcode (must ship the iphoneos SDK)
        run: |
          set -e
          sudo xcodebuild -license accept || true

          # Pick the Xcode that actually bundles the iPhoneOS (device) SDK.
          # GitHub's macos-15 image ships several Xcodes; some (e.g. the
          # explicitly-versioned ones) may be missing the iOS platform, so we
          # probe each one instead of hard-coding a path.
          pick_xcode() {
            for xc in /Applications/Xcode.app /Applications/Xcode_*.app; do
              [ -d "$xc" ] || continue
              sdk=$(DEVELOPER_DIR="$xc/Contents/Developer" \
                    xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || true)
              if [ -n "$sdk" ] && [ -d "$sdk" ]; then
                echo "Found iOS SDK in: $xc"
                echo "  sdk path: $sdk"
                sudo xcode-select -s "$xc"
                return 0
              fi
            done
            return 1
          }

          if ! pick_xcode; then
            echo "No preinstalled iOS SDK found — downloading the platform..."
            sudo xcodebuild -runFirstLaunch || true
            sudo xcodebuild -downloadPlatform iOS
            if ! pick_xcode; then
              echo "FATAL: could not obtain an iOS SDK after download"
              exit 1
            fi
          fi

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version || '3.47.7' }}
          channel: stable
          cache: true

      - name: Setup CocoaPods
        run: |
          brew install cocoapods || true
          pod --version

      - name: Prepare iOS project
        env:
          UPSTREAM_REPO: ${{ inputs.upstream_repo || 'lxsfful/dsh-go' }}
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
          BUNDLE_ID: ${{ inputs.bundle_id || 'io.github.lxsfful.dshgo.troll' }}
          IOS_DEPLOYMENT_TARGET: ${{ inputs.deployment_target || '15.0' }}
        run: bash scripts/prepare.sh

      - name: Build unsigned .ipa
        env:
          BUNDLE_ID: ${{ inputs.bundle_id || 'io.github.lxsfful.dshgo.troll' }}
          IOS_DEPLOYMENT_TARGET: ${{ inputs.deployment_target || '15.0' }}
        run: bash scripts/build_ipa.sh

      - name: Inspect artifact
        run: |
          ls -lh out/
          unzip -l out/*.ipa | head -20
          shasum -a 256 out/*.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Go-TrollStore-IPA
          path: out/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release
        if: ${{ inputs.make_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          name: DSH Go iOS (TrollStore) #${{ github.run_number }}
          body: |
            Unsigned / ad-hoc signed .ipa for TrollStore.
            Upstream: ${{ inputs.upstream_repo || 'lxsfful/dsh-go' }}@${{ inputs.upstream_ref || 'main' }}
            Bundle ID: ${{ inputs.bundle_id || 'io.github.lxsfful.dshgo.troll' }}
          files: out/*.ipa
          draft: false
          prerelease: true
